name: Deploy to Azure Web App
 on:
   push:
     branches: [ main ]
 jobs:
   deploy:
     runs-on: ubuntu-latest
     steps:
     - name: Checkout code
       uses: actions/checkout@v4
     - name: Deploy to Azure Web App
       uses: azure/webapps-deploy@v3
       with:
         publish-profile: ${{ secrets.AZURE_PUBLISH_PROFILE }}
         app-name: empresaraffastore
